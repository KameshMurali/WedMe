name: Layout

# Guards against horizontal overflow on the public site (see #43). Runs on PRs
# so a min-width:auto regression is caught before merge rather than by a guest
# on a phone.
on:
  pull_request:
  workflow_dispatch:

jobs:
  overflow:
    name: No horizontal overflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run layout tests
        run: npm run test:layout
        env:
          # No database is needed: the demo slug renders from a static snapshot
          # and every other public route degrades gracefully with Prisma
          # unreachable. These only satisfy the Zod env parse in src/lib/env.ts.
          DATABASE_URL: postgresql://u:p@127.0.0.1:5432/none
          DIRECT_URL: postgresql://u:p@127.0.0.1:5432/none
          AUTH_SECRET: ci-layout-test-secret-not-a-real-one

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
