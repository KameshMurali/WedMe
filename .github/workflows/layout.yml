name: Layout

# Guards the public site's layout and chrome. Two things, both of which type
# checks and the build pass straight through:
#
#  1. Horizontal overflow (see #43): grid/flex items default to
#     `min-width: auto`, so a track refuses to shrink below its min-content
#     width and the page scrolls sideways on a phone.
#  2. Template chrome: every design must resolve its own backdrop. The
#     per-template switches were written for the original five templates, and
#     the eleven added after fell through to a shared champagne default.
#
# Runs on PRs so either regression is caught before merge rather than by a guest.
on:
  pull_request:
  workflow_dispatch:

jobs:
  overflow:
    name: No horizontal overflow
    # PINNED, not `ubuntu-latest`. GitHub rolled that label to Ubuntu 26.04 and
    # Playwright 1.56.0 refuses to install a browser there:
    #
    #   Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.56.0!
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    #
    # The job died at `playwright install`, before a single test ran, so every
    # PR after the roll failed with nothing to do with its own diff.
    #
    # The fix is the runner and not the Playwright version because the pin runs
    # the other way too: 1.56.0 matches the Chromium build in the dev container
    # (see CLAUDE.md), so bumping it here to chase a newer runner image would
    # break local runs instead. Both ends have to move together, deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run layout tests
        run: npm run test:layout
        env:
          # No database is needed: the demo slug renders from a static snapshot
          # and every other public route degrades gracefully with Prisma
          # unreachable. These only satisfy the Zod env parse in src/lib/env.ts.
          DATABASE_URL: postgresql://u:p@127.0.0.1:5432/none
          DIRECT_URL: postgresql://u:p@127.0.0.1:5432/none
          AUTH_SECRET: ci-layout-test-secret-not-a-real-one

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
