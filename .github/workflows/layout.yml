name: Layout

# Guards the public site's layout and chrome. Two things, both of which type
# checks and the build pass straight through:
#
#  1. Horizontal overflow (see #43): grid/flex items default to
#     `min-width: auto`, so a track refuses to shrink below its min-content
#     width and the page scrolls sideways on a phone.
#  2. Template chrome: every design must resolve its own backdrop. The
#     per-template switches were written for the original five templates, and
#     the eleven added after fell through to a shared champagne default.
#
# Runs on PRs so either regression is caught before merge rather than by a guest.
on:
  pull_request:
  workflow_dispatch:

jobs:
  overflow:
    name: No horizontal overflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run layout tests
        run: npm run test:layout
        env:
          # No database is needed: the demo slug renders from a static snapshot
          # and every other public route degrades gracefully with Prisma
          # unreachable. These only satisfy the Zod env parse in src/lib/env.ts.
          DATABASE_URL: postgresql://u:p@127.0.0.1:5432/none
          DIRECT_URL: postgresql://u:p@127.0.0.1:5432/none
          AUTH_SECRET: ci-layout-test-secret-not-a-real-one

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
